<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>성균관 투어 QR</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔳</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><span class="brand">🔳 <span>투어 접속 QR 코드</span></span></header>
  <main>
    <div class="card no-print">
      <p class="lead" style="margin:0">학생에게 보여 주거나 인쇄해서 나눠 주세요. 이 화면에서 <b>Ctrl + P</b>를 누르면 QR만 인쇄됩니다.</p>
    </div>
    <div class="qr-grid single">
      <section class="card qr-card">
        <p class="kicker">6곳 · 사진 미션 6개 · 퀴즈</p>
        <h1 class="title">🏯 성균관 역사 투어</h1>
        <div class="qr-box" id="qr"></div>
        <p class="qr-url" id="url"></p>
      </section>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      var base = location.href.replace(/[?#].*$/, '').replace(/qr\.html$/, '');
      document.getElementById('url').textContent = base;
      if (window.QRCode) {
        new QRCode(document.getElementById('qr'), { text: base, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M });
      } else {
        document.getElementById('qr').textContent = 'QR 코드를 만들지 못했어요. 인터넷 연결을 확인해 주세요.';
      }
    })();
  </script>
</body>
</html>
